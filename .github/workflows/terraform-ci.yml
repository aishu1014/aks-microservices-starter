name: Terraform CI

on:
  workflow_dispatch:
  pull_request:
    paths: ['terraform/**']
  push:
    branches: [ main ]
    paths: ['terraform/**']

jobs:
  tf:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      # OIDC login (preferred)
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Or use the JSON creds instead (comment the OIDC step above)
      # - name: Azure login (Service Principal JSON)
      #   uses: azure/login@v2
      #   with:
      #     creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform fmt & validate
        run: |
          terraform -chdir=terraform fmt -recursive

          terraform -chdir=terraform init -input=false -upgrade \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=terraform.tfstate"

          terraform -chdir=terraform validate

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          # config_file: terraform/checkov_config.yaml   # only if you have it
          soft_fail: true 

      - name: Terraform plan
        if: github.ref == 'refs/heads/main'
        run: |
          terraform -chdir=terraform init -input=false -upgrade \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_SA }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=terraform.tfstate"

          terraform -chdir=terraform plan -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=terraform apply -auto-approve tfplan
