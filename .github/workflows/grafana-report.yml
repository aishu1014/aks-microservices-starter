name: Daily Grafana Report

on:
  schedule:
    - cron: "0 2 * * *"   # 07:30 IST approx
  workflow_dispatch:       # ✅ REQUIRED for "Run workflow" button

jobs:
  report:
    runs-on: ubuntu-latest
    steps:

      - name: Fetch dashboard image
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
          DASH_UID: ${{ secrets.GRAFANA_DASHBOARD_UID }}
          PANEL_ID: ${{ secrets.GRAFANA_PANEL_ID }}
        run: |
          NOW=$(date -u +%s000)
          FROM=$((NOW-86400000))
          TO=$NOW
          URL="$GRAFANA_URL/render/d-solo/$DASH_UID/_?from=$FROM&to=$TO&panelId=$PANEL_ID&width=1600&height=900"
          echo "Rendering URL: $URL"
          curl -fsSL -H "Authorization: Bearer $GRAFANA_TOKEN" "$URL" -o report.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grafana-daily-report
          path: report.png
