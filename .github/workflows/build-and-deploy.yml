name: Build & Deploy to AKS
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'helm/app/**'

jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push images
        run: |
          docker build -t $REGISTRY/demo-api:$IMAGE_TAG ./app/api
          docker build -t $REGISTRY/demo-web:$IMAGE_TAG ./app/web
          docker push $REGISTRY/demo-api:$IMAGE_TAG
          docker push $REGISTRY/demo-web:$IMAGE_TAG

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS creds
        run: |
          az aks get-credentials -g ${{ secrets.AZ_RG }} -n ${{ secrets.AZ_AKS }} --overwrite-existing

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy app
        run: |
          helm upgrade --install app ./helm/app             --set image.api.repository=$REGISTRY/demo-api             --set image.web.repository=$REGISTRY/demo-web             --set image.tag=$IMAGE_TAG             --namespace app --create-namespace

